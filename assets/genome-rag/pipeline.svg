<title id="title">LLM-assisted genetic evidence pipeline</title><desc id="desc">Genetic experts define scope and review evidence. Build recipes and schemas configure GWAS trait labeling and PMC study extraction with deterministic decisions and validation retries. The merger assembles traceable genetic evidence records for expert review.</desc>
